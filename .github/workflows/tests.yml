name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test,examples,scf,jax]'
      - run: python examples/quickstart.py
      - run: python examples/structured_response.py
      - run: python examples/scf_response.py
      - run: python examples/calibration.py
      - run: python -m pytest tests/grail tests/atmosphere tests/emulator tests/climate_rce/unit tests/regression tests/decisions/test_numerical_contracts.py -m "not analytic and not slow" -ra
      - run: python -m pytest tests/integration/twolevel/test_integration.py tests/decisions/test_decisions.py -m "not slow" -ra
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.python-version }}
          path: dist/*
