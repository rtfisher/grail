name: Software release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install build
      - run: python -m build
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science
      - run: python tools/build_docs.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            docs/user_manual/grail_user_manual.pdf
            docs/reference_guide/grail_reference_guide.pdf
